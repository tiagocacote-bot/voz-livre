name: Fetch ARASAAC pictograms
# Manual: re-downloads the ARASAAC pictograms (the build container may not reach arasaac.org).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install pillow==11.3.0
      - run: python scripts/fetch-arasaac.py
      - name: Commit pictograms
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/symbols scripts/arasaac-meta.json
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Download ARASAAC pictograms'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
